name: SDLC Setup (run once)

on:
  workflow_dispatch:
    inputs:
      setup_pat:
        description: 'PAT with repo scope for branch protection'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Configure branch protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ inputs.setup_pat }}
          script: |
            const { owner, repo: repoName } = context.repo;

            async function protectBranch(branch, approvals) {
              const checks = [{ context: 'SDLC Enforce' }];
              try {
                await github.request('PUT /repos/{owner}/{repo}/branches/{branch}/protection', {
                  owner, repo: repoName, branch,
                  required_status_checks: { strict: true, checks },
                  enforce_admins: false,
                  required_pull_request_reviews: {
                    required_approving_review_count: approvals,
                    dismiss_stale_reviews: true,
                  },
                  restrictions: null,
                  allow_force_pushes: false,
                  allow_deletions: false,
                });
                console.log(`✅ Branch protection set for ${branch}`);
              } catch (err) {
                core.setFailed(`Failed to protect ${branch}: ${err.message}`);
              }
            }

            await protectBranch('dev', 1);
