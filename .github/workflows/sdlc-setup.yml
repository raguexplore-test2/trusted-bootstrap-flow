name: SDLC Setup (run once)

on:
  workflow_dispatch:
    inputs:
      setup_pat:
        description: 'PAT with repo scope for ruleset creation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch protection rulesets
        uses: actions/github-script@v7
        with:
          github-token: ${{ inputs.setup_pat }}
          script: |
            const { owner, repo } = context.repo;

            async function upsertRuleset(config) {
              let existing;
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/rulesets', { owner, repo });
                existing = data.find(r => r.name === config.name);
              } catch {}
              if (existing) {
                await github.request('PUT /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
                  owner, repo, ruleset_id: existing.id, ...config,
                });
              } else {
                await github.request('POST /repos/{owner}/{repo}/rulesets', { owner, repo, ...config });
              }
              console.log(`Upserted ruleset: ${config.name}`);
            }

            try {
              await upsertRuleset({
                name: 'sdlc-main-protection',
                target: 'branch',
                enforcement: 'active',
                conditions: { ref_name: { include: ['refs/heads/dev'], exclude: [] } },
                rules: [
                  { type: 'pull_request', parameters: { required_approving_review_count: 1, dismiss_stale_reviews_on_push: true, require_last_push_approval: false, require_code_owner_review: false, required_review_thread_resolution: false } },
                  { type: 'required_status_checks', parameters: { strict_required_status_checks_policy: true, required_status_checks: [{ context: 'SDLC Enforce' }] } },
                  { type: 'non_fast_forward' }
                ]
              });

              await upsertRuleset({
                name: 'sdlc-release-protection',
                target: 'branch',
                enforcement: 'active',
                conditions: { ref_name: { include: ['refs/heads/rel/*'], exclude: [] } },
                rules: [
                  { type: 'pull_request', parameters: { required_approving_review_count: 1, dismiss_stale_reviews_on_push: true, require_last_push_approval: false, require_code_owner_review: false, required_review_thread_resolution: false } },
                  { type: 'required_status_checks', parameters: { strict_required_status_checks_policy: true, required_status_checks: [{ context: 'SDLC Enforce' }] } },
                  { type: 'non_fast_forward' }
                ]
              });

              console.log('✅ All SDLC rulesets created.');
            } catch (err) {
              core.setFailed(`Ruleset creation failed (${err.status}): ${err.message}`);
            }
